[project]
name = "cyber-security-test-pipeline"
version = "3.1.0"
description = "API security scanner with exploit verification and closed-loop remediation - validated findings from recon to report."
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = [
    "httpx==0.28.0",
    "aiohttp==3.14.3",
    "urllib3==2.7.0",
    "requests==2.33.0",
    "pydantic==2.12.0",
    "pydantic-settings==2.14.2",
    "pyyaml==6.0.3",
    "jinja2==3.1.6",
    "click==8.3.3",
    "rich==14.0.0",
    "dnspython==2.8.0",
    "cryptography==50.0.0",
    "beautifulsoup4==4.14.0",
    "fastapi==0.136.3",
    "starlette==1.3.1",
    "uvicorn[standard]==0.30.0",
    "python-multipart==0.0.31",
    "email-validator==2.0.0",
    "sse-starlette==3.0.0",
    "redis[hiredis]==6.4.0",
    "websockets==15.0",
    "PyJWT==2.13.0",
    "prometheus-client==0.24.0",
    "opentelemetry-api==1.41.1",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-exporter-otlp-proto-http==1.41.1",
    "psutil==5.9.8",
    "sqlalchemy==2.0.30",
    "alembic==1.14.0",
    "aiosqlite==0.20.0",
    "numpy==2.2.0",
    "Pillow==12.3.0",
    "networkx==3.0.0",
    "beartype==0.20.1",
    "mmh3==5.1.0",
    "argon2-cffi==23.1.0",
    "msgspec==0.21.1",
    "msgpack==1.2.1",
    "cloudpickle==3.0.0",
    "watchfiles==1.0.4",
    "scipy==1.14.1",
    "pykka==4.0.0",
    "defusedxml==0.7.1",
]

[project.scripts]
cstp = "src.cli:main"
cyber-pipeline = "src.pipeline.runtime:main"
cstp-pipeline = "src.pipeline.runtime:main"
cyber-worker = "src.infrastructure.queue.worker_lite:main"
cstp-worker = "src.infrastructure.queue.worker_lite:main"
cyber-dashboard-fastapi = "src.dashboard.fastapi.main:main"
cstp-dashboard = "src.dashboard.fastapi.main:main"

[project.optional-dependencies]
test = [
    "hypothesis>=6.151.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-snapshot>=0.7.0",
    "pytest-timeout>=2.4.0",
    "defusedxml==0.7.1",
]
dev = [
    "detect-secrets==1.5.0",
    "hypothesis>=6.151.0",
    "mutmut>=3.5.0",
    "mypy>=1.20.0",
    "pip-audit>=2.10.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-snapshot>=0.7.0",
    "pytest-timeout>=2.4.0",
    "ruff==0.15.*",
    "jsonschema>=4.0.0",
    "safety>=3.7.0",
    "vulture>=2.16",
    "bandit>=1.8.0",
    "cyclonedx-bom>=5.0.0",
    "import-linter>=2.0.0",
    "locust>=2.43.0",
    "pytest-benchmark>=5.0.0",
    "memory-profiler>=0.61.0",
    "line-profiler>=4.2.0",
]
ml = [
    "scipy>=1.14.1",
]
wasm = [
    "pykka==4.0.0",
    "wasmtime==44.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --tb=short --strict-markers --import-mode=importlib -p no:locust"
timeout = 20
timeout_method = "thread"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "architecture: marks tests as architecture tests",
    "unit: marks tests as unit tests",
    "regression: marks tests as regression tests",
    "security: marks tests as security tests",
    "chaos: marks chaos tests requiring infrastructure (docker, redis, etc.)",
    "mock_heavy: marks tests that use heavy mocking or extensive fixtures",
    "asyncio: marks tests as asynchronous",
    "timeout: per-test timeout override (pytest-timeout)",
]

filterwarnings = []

[tool.coverage.run]
source = ["src.analysis", "src.core", "src.pipeline", "src.dashboard", "src.recon", "src.execution", "src.reporting", "src.intelligence", "src.detection", "src.decision", "src.fuzzing", "src.infrastructure.queue", "src.infrastructure.execution_engine", "src.infrastructure.cache", "src.infrastructure.observability", "src.infrastructure.security", "src.infrastructure.notifications", "src.dashboard.fastapi", "src.websocket_server", "src.learning", "src.exploitation"]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "src/execution/validators/validators/*",
    "src/intelligence/feeds/*",
    "src/infrastructure/notifications/*",
    "scripts/audit/*",
    "scripts/debug/*",
    "scripts/read_job.py",
    "scripts/find_password_refs.py",
    "scripts/fix_bare_excepts.py",
    "scripts/pipeline_main.py",
    "start_backend.py"
]

[tool.coverage.report]
fail_under = 45
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]
extend-exclude = [
    ".ai",
    ".benchmarks",
    ".hypothesis",
    ".kilo",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".venv-linux",
    "frontend",
    "output",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S601", "S603", "S607", "S608"]
ignore = [
    "E501",
    "S101",
    "S102",
    "S103",
    "S104",
    "S106",
    "S107",
    "S313",
    "S314",
    "S310",
    "S311",
    "E701",
    "E402",
    "N806",
    "N803",
    "N818",
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["src", "src.analysis", "src.core", "src.pipeline", "src.dashboard", "src.recon", "src.execution", "src.reporting", "src.intelligence", "src.detection", "src.decision", "src.fuzzing", "src.infrastructure", "src.infrastructure.queue", "src.infrastructure.cache", "src.infrastructure.execution_engine", "src.infrastructure.observability", "src.infrastructure.security", "src.websocket_server", "src.learning", "src.exploitation"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S311", "N806", "N818", "S104"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "scripts/",
    "frontend/",
    "benchmarks/",
    "tmp_scratch/",
    "tmp_reports/",
    "tmp_.*.py",
    "import_audit.*.py",
    "circular_check.*.py",
    "analyze_coverage.py",
    "coverage_deep.py",
    "find_missing_inits.py",
    "fix_import_audit.py",
]
ignore_missing_imports = false
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "requests",
    "psutil",
    "msgpack",
    "defusedxml",
    "defusedxml.*",
    "yaml",
    "jsonschema",
    "scipy",
    "scipy.*",
    "reportlab",
    "reportlab.*",
    "google.cloud",
    "google.cloud.*",
    "boto3",
    "botocore",
    "botocore.*",
    "azure.*",
    "kuzu",
    "pykka",
    "wasmtime",
    "crcmod",
    "diff_match_patch",
    "playwright",
    "playwright.*",
    "h2",
    "h2.*",
    "structlog",
    "opentelemetry.exporter.otlp.proto.grpc.trace_exporter",
    "src.infrastructure.discovery.mdns",
    "src.analysis.endpoint_intelligence_scoring",
    "src.execution.steps.template",
    "src.core.models.pipeline_state",
    "websocket",
    "websocket.*",
    "_dummy_process",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "start_backend"
disallow_untyped_defs = false
ignore_errors = true

